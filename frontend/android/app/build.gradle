apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = [
    rootProject.file("keystore.properties"),
    new File(System.getProperty("user.home"), "ADVAULT_KEYS/keystore.properties")
].find { it != null && it.exists() }
if (keystorePropertiesFile != null) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def envVersionCode = System.getenv("ADVAULT_VERSION_CODE")
def envVersionName = System.getenv("ADVAULT_VERSION_NAME")
def envKeystoreFile = System.getenv("ADVAULT_KEYSTORE_FILE")
def envStorePassword = System.getenv("ADVAULT_KEYSTORE_PASSWORD")
def envKeyPassword = System.getenv("ADVAULT_KEY_PASSWORD")
def envKeyAlias = System.getenv("ADVAULT_KEY_ALIAS")
int resolvedVersionCode = 1
if (envVersionCode != null && envVersionCode.trim().isInteger()) {
    resolvedVersionCode = envVersionCode.trim().toInteger()
}
def resolvedVersionName = (envVersionName != null && !envVersionName.trim().isEmpty()) ? envVersionName.trim() : "1.0"

android {
    namespace = "com.advault.tt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.advault.tt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePasswordValue = envStorePassword ?: keystoreProperties['storePassword']
            def keyPasswordValue = envKeyPassword ?: keystoreProperties['keyPassword']
            def keyAliasValue = (envKeyAlias != null && !envKeyAlias.trim().isEmpty()) ? envKeyAlias.trim() : (keystoreProperties['keyAlias'] ?: "advault-release")
            if (storePasswordValue && keyPasswordValue) {
                def configuredStore = (envKeystoreFile != null && !envKeystoreFile.trim().isEmpty()) ? envKeystoreFile.trim() : keystoreProperties['storeFile']
                storeFile configuredStore ? file(configuredStore) : file("${System.getProperty('user.home')}/ADVAULT_KEYS/advault-release.jks")
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
