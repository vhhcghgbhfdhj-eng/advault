<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADVAULT TT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var path = String(location.pathname || "");
          var hash = String(location.hash || "");
          var rest = String(location.search || "") + hash;
          if (path.indexOf("/admin-recovery") === 0 || hash.indexOf("admin-recovery") !== -1) {
            document.documentElement.setAttribute("data-advault-admin-recovery", "1");
          } else if (path.indexOf("/reset") === 0 || hash.indexOf("reset") !== -1 || /(?:^|[?&#])reset=/.test(rest) || /(?:^|[?&#])code=/.test(rest)) {
            document.documentElement.setAttribute("data-advault-reset", "1");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
